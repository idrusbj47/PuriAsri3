const MAG='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2a1d04" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/><path d="M8 8h2v2H8zM11.5 11.5h2v2h-2z" fill="#2a1d04" stroke-width="1"/></svg>';
function view(){$('#vLogin').classList.toggle('hide',!!U);$('#vApp').classList.toggle('hide',!U);$('#nav').classList.toggle('hide',!U);$('#lo').classList.toggle('hide',!U);if(U){buildNav();go(U.role=='petugas'?'pHome':'tr')}}
function buildNav(){const P=U.role=='petugas',adm=sb&&U.role=='admin',it=P?[['pHome','🏠','Beranda'],['pRiw','🕘','Riwayat'],'scan',['pInfo','ℹ️','Info'],['pProf','👤','Profil']]:[['tr','💰','Rekap'],['tf','🖼️','Foto'],['th','🏘️','Rumah'],adm&&['tu','👥','Pengguna'],['ts','⚙️','Setelan'],['pProf','👤','Profil']].filter(Boolean);
 $('#nav').innerHTML=it.map(x=>x=='scan'?`<button class="ctr" id="nsc"><span>${MAG}</span><em>Scan</em></button>`:`<button data-p="${x[0]}"><i>${x[1]}</i>${x[2]}</button>`).join('');
 document.querySelectorAll('#nav [data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));const s=$('#nsc');if(s)s.onclick=startScan}
function go(p){document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('hide',e.id!=p));document.querySelectorAll('#nav [data-p]').forEach(b=>b.classList.toggle('act',b.dataset.p==p));
 if(p=='pProf')profLoad();else if(U.role=='petugas')petLoad();else benLoad();scrollTo(0,0)}
async function profLoad(){$('#pn').value=U.name;const e=await api.myEmail();$('#pcur').textContent=`${U.name} · ${({petugas:'Petugas',bendahara:'Bendahara',admin:'Super admin'})[U.role]} · login: ${e.replace('@ronda.puriasri3.com','')}`}
$('#ps').onclick=async()=>{try{const n=$('#pn').value.trim(),u=$('#pu').value.trim(),w=$('#pw').value;if(w&&(w.length<6||w!=$('#pw2').value))return toast('Sandi min. 6 karakter & harus sama');
 if(n&&n!=U.name){await api.setName(n);U.name=n}if(u)await api.setEmail(em(u));if(w)await api.setPass(w);
 $('#pu').value=$('#pw').value=$('#pw2').value='';toast('Profil diperbarui');profLoad()}catch(e){toast(e.message)}};
$('#px').onclick=()=>$('#lo').click();
document.addEventListener('gesturestart',e=>e.preventDefault());
async function boot(){if(!sb){$('#demo').classList.remove('hide');$('#lu').textContent='Username';$('#byl').classList.remove('hide')}
 U=await api.me();if(U)await enter();view()}
async function enter(){try{ST={...ST,...await api.st()}}catch(e){}U.role!='petugas'?benLoad():petLoad()}
$('#bl').onclick=async()=>{try{U=await api.login(sb?em($('#u').value.trim()):$('#u').value.trim(),$('#p').value);if(!sb)sessionStorage.du=JSON.stringify(U);await enter();view()}catch(e){toast(e.message||'Gagal masuk')}};
$('#lo').onclick=async()=>{await api.out();U=null;view()};

/* ========= PETUGAS ========= */
async function petLoad(){ST={...ST,...await api.st()};paintSt();$('#info').innerHTML=`<b>Info Ronda</b><p style="font-size:14px;line-height:1.7;margin-top:8px">🕙 Aktif: <b>${ST.start.slice(0,5)}–${ST.end.slice(0,5)} WIB</b><br>💰 Tarif: <b>${rp(ST.rate)}</b> per foto rumah<br>📍 Foto otomatis diberi cap lokasi &amp; waktu<br>🏠 Satu rumah dihitung sekali per malam<br>📷 Foto hanya dari kamera, tidak dari galeri<br>💵 Saldo dibayarkan oleh bendahara</p>`;$('#rt').textContent=`Tiap foto rumah: ${rp(ST.rate)} · aktif ${ST.start.slice(0,5)}–${ST.end.slice(0,5)} WIB`;
 $('#sal').textContent=rp(await api.saldo());const L=await api.mine();$('#h3').innerHTML=$('#hist').innerHTML=L.length?L.map(l=>`<div class="row"><div class="grow"><b>${l.houses?.name||l.house_code}</b><small>${fmt(l.created_at)}</small></div><b style="color:var(--g7)">+${rp(l.amount)}</b></div>`).join(''):'<p style="color:var(--soft);font-size:13px;padding-top:8px">Belum ada foto.</p>'}
function paintSt(){const o=isOpen(),e=$('#st');e.textContent=o?'Ronda AKTIF':'Di luar jam ronda';e.className='chip '+(o?'on':'off')}
setInterval(()=>U&&U.role=='petugas'&&paintSt(),20000);
async function startScan(){await petLoad().catch(()=>{});if(!isOpen())return toast(`Ronda hanya aktif ${ST.start.slice(0,5)}–${ST.end.slice(0,5)} WIB`);unlock();openCam('scan')}
$('#go').onclick=startScan;

/* ========= KAMERA: scan barcode + ambil foto (live camera only, tanpa galeri) ========= */
async function openCam(m){mode=m;$('#cam').classList.remove('hide');$('#bs').classList.toggle('hide',m!='scan');$('#bp').classList.toggle('hide',m=='scan');$('#fr').classList.toggle('hide',m!='scan');
 $('#ct').textContent=m=='scan'?'Arahkan ke barcode rumah':H.name;
 if(!stream){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});$('#v').srcObject=stream}catch(e){toast('Kamera tidak bisa dibuka (butuh HTTPS & izin kamera)');return closeCam()}}
 if(!gw&&navigator.geolocation)gw=navigator.geolocation.watchPosition(p=>{GPS={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};$('#gp').textContent=`GPS ±${Math.round(GPS.acc)} m`},()=>$('#gp').textContent='GPS mati!',{enableHighAccuracy:true,maximumAge:3000});
 if(m=='scan')scanLoop()}
function closeCam(){mode='';stream&&stream.getTracks().forEach(t=>t.stop());stream=null;gw!=null&&navigator.geolocation.clearWatch(gw);gw=null;$('#cam').classList.add('hide')}
$('#cx').onclick=closeCam;
async function scanLoop(){const v=$('#v');let bd=null;try{if('BarcodeDetector' in window)bd=new BarcodeDetector()}catch(e){}
 if(!bd&&!window.jsQR)toast('Pustaka scan gagal dimuat — cek internet, atau ketik kode manual');
 try{const t=stream.getVideoTracks()[0];await t.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
 const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
 while(mode=='scan'&&stream){await new Promise(r=>setTimeout(r,200));if(!v.videoWidth)continue;let code=null;
  try{if(bd){const r=await bd.detect(v);code=r[0]&&r[0].rawValue}}catch(e){}
  if(!code&&window.jsQR){try{const w=Math.min(v.videoWidth,960);c.width=w;c.height=Math.round(w*v.videoHeight/v.videoWidth);x.drawImage(v,0,0,c.width,c.height);const i=x.getImageData(0,0,c.width,c.height),r=jsQR(i.data,c.width,c.height,{inversionAttempts:'attemptBoth'});code=r&&r.data}catch(e){}}
  try{if(code&&await pick(code))return}catch(e){toast('Gagal membaca data rumah: '+(e.message||e))}}}
async function pick(code){const h=await api.house(code.trim());if(!h){if(Date.now()-scanT>2500)toast('Kode "'+code+'" tidak terdaftar');scanT=Date.now();return false}H=h;ting();openCam('shot');return true}
$('#mb').onclick=()=>$('#mc').value&&pick($('#mc').value);
$('#sh').onclick=()=>{if(!GPS)return toast('Menunggu sinyal GPS… aktifkan lokasi');const v=$('#v');raw=document.createElement('canvas');raw.width=v.videoWidth;raw.height=v.videoHeight;raw.getContext('2d').drawImage(v,0,0);
 meta={t:new Date(),...GPS};closeCam();hist=[{c:raw,br:0}];$('#br').value=0;$('#ed').classList.remove('hide');draw()};

/* ========= EDITOR: putar, crop, cahaya, undo ========= */
function render(h){const c=document.createElement('canvas');c.width=h.c.width;c.height=h.c.height;const x=c.getContext('2d');x.drawImage(h.c,0,0);
 if(h.br>0){x.globalCompositeOperation='lighter';x.globalAlpha=h.br/100;x.drawImage(h.c,0,0)}else if(h.br<0){x.globalAlpha=-h.br/100;x.fillStyle='#000';x.fillRect(0,0,c.width,c.height)}return c}
const top_=()=>hist[hist.length-1];
function draw(b){const t=top_(),r=render({c:t.c,br:b==null?t.br:b}),p=$('#pv');p.width=r.width;p.height=r.height;p.getContext('2d').drawImage(r,0,0)}
$('#br').oninput=()=>draw(+$('#br').value);
$('#br').onchange=()=>{hist.push({c:top_().c,br:+$('#br').value});draw()};
$('#rot').onclick=()=>{const t=top_(),c=document.createElement('canvas');c.width=t.c.height;c.height=t.c.width;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(t.c,-t.c.width/2,-t.c.height/2);hist.push({c,br:t.br});draw()};
$('#und').onclick=()=>{if(hist.length>1){hist.pop();$('#br').value=top_().br;draw()}else toast('Tidak ada yang di-undo')};
$('#rt2').onclick=()=>{$('#ed').classList.add('hide');openCam('shot')};
let cr,drag;const cb=$('#cb');
function pcb(){Object.assign(cb.style,{left:cr.x*100+'%',top:cr.y*100+'%',width:cr.w*100+'%',height:cr.h*100+'%'})}
function cropUI(on){cb.classList.toggle('hide',!on);$('#e1').classList.toggle('hide',on);$('#e2').classList.toggle('hide',on);$('#e3').classList.toggle('hide',!on)}
$('#crp').onclick=()=>{cr={x:.1,y:.1,w:.8,h:.8};pcb();cropUI(true)};$('#cc').onclick=()=>cropUI(false);
$('#ca').onclick=()=>{const t=top_(),W=t.c.width,Hh=t.c.height,c=document.createElement('canvas');c.width=Math.round(cr.w*W);c.height=Math.round(cr.h*Hh);c.getContext('2d').drawImage(t.c,cr.x*W,cr.y*Hh,cr.w*W,cr.h*Hh,0,0,c.width,c.height);hist.push({c,br:t.br});cropUI(false);draw()};
cb.onpointerdown=e=>{drag={k:e.target.dataset.k||'m',x:e.clientX,y:e.clientY,o:{...cr}};cb.setPointerCapture(e.pointerId)};
cb.onpointermove=e=>{if(!drag)return;const r=$('#pv').getBoundingClientRect(),dx=(e.clientX-drag.x)/r.width,dy=(e.clientY-drag.y)/r.height,o=drag.o,k=drag.k;let{x,y,w,h}=o;
 if(k=='m'){x=clamp(o.x+dx,0,1-w);y=clamp(o.y+dy,0,1-h)}else{
  if(k[1]=='l'){x=clamp(o.x+dx,0,o.x+o.w-.1);w=o.x+o.w-x}if(k[1]=='r')w=clamp(o.w+dx,.1,1-o.x);
  if(k[0]=='t'){y=clamp(o.y+dy,0,o.y+o.h-.1);h=o.y+o.h-y}if(k[0]=='b')h=clamp(o.h+dy,.1,1-o.y)}
 cr={x,y,w,h};pcb()};cb.onpointerup=()=>drag=null;

/* ========= STAMP (lokasi+waktu) & KOMPRES <500KB ========= */
function stamp(c){const x=c.getContext('2d'),f=Math.max(16,Math.round(Math.max(c.width,c.height)/55)),L=[`${H.name} (${H.code})`,fmt(meta.t),`Lat ${meta.lat.toFixed(6)}, Lng ${meta.lng.toFixed(6)} (±${Math.round(meta.acc)} m)`,`Petugas: ${U.name}`],h=L.length*f*1.35+f;
 x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,c.height-h,c.width,h);x.fillStyle='#fff';x.font=`600 ${f}px sans-serif`;x.textBaseline='top';L.forEach((t,i)=>x.fillText(t,f*.7,c.height-h+f*.5+i*f*1.35))}
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function compress(src){const MAX=480*1024;let s=Math.min(1,1600/Math.max(src.width,src.height)),q=.85,b;
 for(let i=0;i<14;i++){const c=document.createElement('canvas');c.width=Math.round(src.width*s);c.height=Math.round(src.height*s);c.getContext('2d').drawImage(src,0,0,c.width,c.height);b=await toBlob(c,q);if(b.size<=MAX)return b;q-=.08;if(q<.45){q=.8;s*=.85}}return b}

/* ========= SIMPAN ========= */
$('#svp').onclick=async()=>{const btn=$('#svp');if(!isOpen())return toast('Jam ronda sudah berakhir');unlock();btn.disabled=true;btn.textContent='Menyimpan…';
 try{const f=render(top_());stamp(f);const b=await compress(f),path=`${U.id}/${meta.t.toISOString().replace(/[:.]/g,'-')}_${H.code}.jpg`;
  await api.up(b,path);await api.submit({code:H.code,path,lat:meta.lat,lng:meta.lng,acc:meta.acc,t:meta.t});
  $('#ed').classList.add('hide');$('#ok').classList.remove('hide');$('#okm').textContent=`+${rp(ST.rate)} · ${H.name} · ${Math.round(b.size/1024)} KB`;ting();
  setTimeout(()=>{$('#ok').classList.add('hide');petLoad()},2200)}
 catch(e){toast(e.code=='23505'||/duplicate|sudah/.test(e.message||'')?'Rumah ini sudah difoto malam ini':(e.message||'Gagal menyimpan'))}
 btn.disabled=false;btn.textContent='✔ Simpan'};

/* ========= BENDAHARA ========= */
async function benLoad(){const adm=sb&&U.role=='admin';adm&&userLoad();houseLoad();ST={...ST,...await api.st()};$('#sr').value=ST.rate;$('#ss').value=ST.start.slice(0,5);$('#se').value=ST.end.slice(0,5);$('#by').checked=!!ST.bypass;
 const R=await api.rekap();$('#tr').innerHTML=R.map(r=>`<div class="card"><div class="row"><div class="grow"><b>${r.name}</b><small>${r.fotos} foto tercatat</small></div><div style="text-align:right"><div class="saldo" style="font-size:22px">${rp(r.saldo)}</div><button class="btn sm gold" data-pay="${r.user_id}" ${r.saldo>0?'':'disabled'}>Bayarkan</button></div></div></div>`).join('')||'<p>Belum ada petugas.</p>';
 document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{if(confirm('Tandai saldo petugas ini sudah dibayar (jadi Rp0)?')){await api.pay(b.dataset.pay);benLoad()}});
 const L=await api.all();$('#tf').innerHTML='<div class="card">'+(L.map(l=>`<div class="row"><img data-p="${l.photo_path}" alt=""><div class="grow"><b>${l.houses?.name||l.house_code}</b><small>${l.profiles?.name||''}<br>${fmt(l.created_at)}</small></div><b>${rp(l.amount)}</b></div>`).join('')||'Belum ada foto.')+'</div>';
 document.querySelectorAll('#tf img').forEach(async i=>{const u=await api.url(i.dataset.p);i.src=u;i.onclick=()=>{$('#vi').src=u;$('#vw').classList.remove('hide')}})}
$('#sv').onclick=async()=>{await api.saveSt({rate:+$('#sr').value,start:$('#ss').value,end:$('#se').value,bypass:$('#by').checked});toast('Pengaturan disimpan');benLoad()};
const RL={petugas:'Petugas',bendahara:'Bendahara',admin:'Super admin'};
async function userLoad(){const L=await api.users();$('#ul').innerHTML=L.map(x=>`<div class="row"><div class="grow"><b>${x.name}</b><small>${x.email.replace('@ronda.puriasri3.com','')}</small></div><select data-r="${x.id}" data-n="${x.name}" style="padding:8px;border-radius:10px">${Object.keys(RL).map(k=>`<option value="${k}" ${k==x.role?'selected':''}>${RL[k]}</option>`).join('')}</select><button class="btn sm line" data-x="${x.id}">Hapus</button></div>`).join('')||'Belum ada pengguna.';
 document.querySelectorAll('[data-r]').forEach(s=>s.onchange=async()=>{try{await api.setRole(s.dataset.r,s.dataset.n,s.value);toast('Peran diubah')}catch(e){toast(e.message)}userLoad()});
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus pengguna ini dari aplikasi?')){try{await api.delUser(b.dataset.x);userLoad()}catch(e){toast('Tidak bisa dihapus: sudah punya riwayat. Ubah perannya saja.')}}})}
$('#ua').onclick=async()=>{const n=$('#un').value.trim(),e=em($('#ue').value.trim()),p=$('#up').value;if(!n||!$('#ue').value.trim()||p.length<6)return toast('Isi nama, username, dan sandi min. 6 karakter');
 try{$('#ua').disabled=true;await api.addUser(n,e,p,$('#ur').value);$('#un').value=$('#ue').value=$('#up').value='';toast('Pengguna ditambahkan');userLoad()}catch(x){toast(/confirm|email/i.test(x.message||'')?x.message+' (cek: Confirm email harus OFF)':x.message)}$('#ua').disabled=false};
const qr=c=>{if(!window.qrcode)return '<small>QR gagal dimuat (cek internet)</small>';const q=qrcode(0,'M');q.addData(c);q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true})};
async function houseLoad(){const L=await api.houses();$('#hl').innerHTML=L.map(h=>`<div class="row"><div style="width:54px">${qr(h.code)}</div><div class="grow"><b>${h.name}</b><small>Kode: ${h.code}</small></div><button class="btn sm line" data-d="${h.code}">Hapus</button></div>`).join('')||'Belum ada rumah.';
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus rumah '+b.dataset.d+'? (ditolak bila sudah punya riwayat foto)')){try{await api.delH(b.dataset.d);houseLoad()}catch(e){toast('Tidak bisa dihapus: sudah ada riwayat foto')}}})}
$('#ha').onclick=async()=>{const c=$('#hc').value.trim().toUpperCase(),n=$('#hn').value.trim();if(!c||!n)return toast('Isi kode dan nama rumah');try{await api.addH(c,n);$('#hc').value=$('#hn').value='';houseLoad()}catch(e){toast(e.message)}};
$('#hp').onclick=async()=>{const L=await api.houses();if(!L.length)return toast('Belum ada rumah');const p=$('#pr');p.innerHTML='<div class="g">'+L.map(h=>`<div class="q">${qr(h.code)}<div>${h.name}</div><div style="font-weight:400">${h.code}</div></div>`).join('')+'</div>';p.classList.remove('hide');setTimeout(()=>{window.print();p.classList.add('hide')},300)};
boot();
</script></body></html>
